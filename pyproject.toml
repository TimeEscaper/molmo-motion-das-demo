[project]
name = "molmo-motion-das-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "av>=16.0.0",
    "cached-path>=1.8.10",
    "click>=8.1.0",
    "datasets>=2.19.1",
    "decord>=0.6.0",
    "einops>=0.8.0",
    "ftfy>=6.1.0",
    "h5py>=3.10",
    "huggingface-hub>=0.25.0",
    "hydra-core>=1.3.0",
    "imageio-ffmpeg>=0.6.0",
    "imageio[ffmpeg]>=2.37.0",
    "kornia>=0.8.0",
    "matplotlib>=3.9.0",
    "ninja>=1.13.2",
    "numpy==1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.11.0",
    "openexr>=3.2.0",
    "packaging>=24.1",
    "pandas>=2.3.3",
    "pillow>=11.0.0",
    "pycocotools>=2.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.28.1",
    "safetensors>=0.4.0",
    "sam3",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.0",
    "timm>=1.0.24",
    "tokenizers>=0.21.0",
    "torch==2.9.1",
    "torchcodec==0.9.*",
    "torchmetrics>=1.0.3",
    "torchvision==0.24.1",
    "tqdm>=4.66.0",
    "transformers>=4.56",
    "vipe",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["vipe"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
sam3 = { path = "data_generation/third_party/sam3" }
vipe = { path = "data_generation/third_party/vipe" }
